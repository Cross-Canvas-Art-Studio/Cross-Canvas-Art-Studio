<div class="drop-zone" id="dropZone" tabindex="0">
    <input type="file" id="imageInput" accept="image/*" hidden>
    <div class="drop-inner">
        <span class="drop-icon" aria-hidden="true">&#128247;</span>
        <p><strong>Drop an image</strong> or click to browse</p>
        <p class="hint">PNG, JPG, GIF, BMP, WEBP</p>
    </div>
    <img id="uploadPreview" alt="Selected image preview" hidden>
</div>
